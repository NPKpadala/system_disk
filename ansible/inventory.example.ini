# Copy to inventory.ini and point it at your estate.
#
#   cp inventory.example.ini inventory.ini
#   ansible-playbook site.yml
#
# Ansible is agentless: no daemon is installed on the targets, only the
# collector script and a systemd timer. One control node drives the whole fleet
# over SSH, so onboarding host number 500 costs the same as host number 1.

[linux:children]
app
db
batch

[app]
app-01.example.com
app-02.example.com

[db]
db-01.example.com fs_monitor_cost_per_gb_month=0.12

[batch]
# Hosts with volumes that must never be flagged, whatever the metrics say.
batch-01.example.com fs_monitor_exclude_mounts='["/mnt/regulatory-archive"]'

[linux:vars]
ansible_user=ansible
ansible_become=true
