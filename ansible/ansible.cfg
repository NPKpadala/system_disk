[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 50

# No stdout_callback or callbacks_enabled here on purpose. The `yaml` callback
# was removed in ansible-core 2.21 and `profile_tasks` lives in a collection,
# so naming either one makes every playbook abort at startup on a control node
# that does not have it. Prettier output is not worth that. To opt in locally:
#
#   ansible-galaxy collection install ansible.posix
#   ANSIBLE_STDOUT_CALLBACK=community.general.yaml \
#   ANSIBLE_CALLBACKS_ENABLED=ansible.posix.profile_tasks ansible-playbook site.yml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
