---
- name: Restart fs-monitor timer
  when: ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.systemd_service:
    name: fs-monitor.timer
    state: restarted
    daemon_reload: true

- name: Reload systemd
  when: ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.systemd_service:
    daemon_reload: true
